name: Build APKs for Android using Nix

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      env:
        github_secret: ${{ secrets.GITHUB_TOKEN }}

    - name: Check Necessary environment variables presence
      run: |
        if [ -z "$LOCAL_PROPERTIES" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "You may want to add LOCAL_PROPERTIES and GOOGLE_SERVICES_JSON environment variables to your secrets"
          exit 1
        fi

    - name: Build Task
      run: nix --experimental-features "nix-command flakes" run .#buildRelease
    
    - uses: actions/upload-artifact@v7
      with:
        name: app-universal-release
        path: app/build/outputs/apk/release/app-universal-release.apk

    - uses: actions/upload-artifact@v7
      with:
        name: app-arm64-v8a-release
        path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

    - uses: actions/upload-artifact@v7
      with:
        name: app-armeabi-v7a-release
        path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk

    - uses: actions/upload-artifact@v7
      with:
        name: app-x86_64-release
        path: app/build/outputs/apk/release/app-x86_64-release.apk
